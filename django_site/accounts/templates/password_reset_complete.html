{% extends "base.html" %}

{% block title %}Пароль обновлен | MixxTranslate{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
  <section class="auth-layout">
    <div class="auth-copy">
      <div class="hero-tag">Готово</div>
      <h1>Пароль успешно<br><em>обновлен</em></h1>
      <p>Теперь можно войти с новым паролем.</p>
    </div>

    <div class="auth-card auth-status-card auth-panel">
      <div class="status-badge">Пароль сохранён</div>
      <h2 class="auth-title">Можно входить</h2>
      <div class="auth-actions">
        <a class="btn-primary btn-block" href="{% url 'login' %}">Перейти ко входу</a>
        <a class="btn-secondary btn-block" href="{% url 'home' %}">На главную</a>
      </div>
    </div>
  </section>
{% endblock %}
